name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild and upload (for example v0.2.0)"
        required: false
        type: string
      source_ref:
        description: "Git ref to build from (defaults to the release tag)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag || needs.release-please.outputs.tag_name || github.sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Validate recovery release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$TAG_NAME" = "v${VERSION}"
          gh release view "$TAG_NAME"

      - name: Install build tooling
        run: command -v cmake >/dev/null || brew install cmake

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: .engine-deps
          key: engine-deps-${{ runner.os }}-${{ hashFiles('Scripts/build-engine-deps.sh') }}

      - name: Build engine dependencies
        run: ./Scripts/build-engine-deps.sh

      - name: Build native engine
        run: ./Scripts/build-engine.sh

      - name: Run tests
        run: swift test

      - name: Build app
        env:
          LENTERA_VERSION: ${{ steps.version.outputs.version }}
          LENTERA_BUILD: ${{ github.run_number }}
        run: ./Scripts/build-app.sh

      - name: Build DMG
        run: ./Scripts/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Lentera-macOS
          path: build/Lentera-v*-macOS.dmg

      - name: Upload release asset
        if: needs.release-please.outputs.release_created == 'true' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" "build/Lentera-v${VERSION}-macOS.dmg" --clobber

      - name: Generate Sparkle appcast
        if: needs.release-please.outputs.release_created == 'true' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::warning title=Sparkle appcast skipped::Set the SPARKLE_PRIVATE_KEY repository secret to publish auto-updates."
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz"
          tar -xJf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p updates
          cp "build/Lentera-v${VERSION}-macOS.dmg" updates/
          gh release view "$TAG_NAME" --json body --jq .body > "updates/Lentera-v${VERSION}-macOS.md"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/bin/generate_appcast" \
            --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases" \
            updates
          gh release upload "$TAG_NAME" updates/appcast.xml --clobber
