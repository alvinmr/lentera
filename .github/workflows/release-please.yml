name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild and upload (for example v0.2.0)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || needs.release-please.outputs.tag_name || github.sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Validate recovery release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$TAG_NAME" = "v${VERSION}"
          gh release view "$TAG_NAME"

      - name: Install native dependencies
        run: brew install curl libzip openssl@3 pugixml

      - name: Build native engine
        run: ./Scripts/build-engine.sh

      - name: Run tests
        run: swift test

      - name: Build app
        env:
          LENTERA_VERSION: ${{ steps.version.outputs.version }}
        run: ./Scripts/build-app.sh

      - name: Package app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ditto -c -k --sequesterRsrc --keepParent build/Lentera.app "build/Lentera-v${VERSION}-macOS.zip"

      - name: Verify package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: shasum -a 256 "build/Lentera-v${VERSION}-macOS.zip"

      - name: Build DMG
        run: ./Scripts/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Lentera-macOS
          path: |
            build/Lentera-v*-macOS.zip
            build/Lentera-v*-macOS.dmg

      - name: Upload release asset
        if: needs.release-please.outputs.release_created == 'true' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" "build/Lentera-v${VERSION}-macOS.zip" "build/Lentera-v${VERSION}-macOS.dmg" --clobber
