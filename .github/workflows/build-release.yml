name: Build macOS release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Install native dependencies
        run: brew install curl libzip openssl@3 pugixml

      - name: Build app
        env:
          LENTERA_VERSION: ${{ steps.version.outputs.version }}
        run: ./Scripts/build-app.sh

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/Lentera.app "build/Lentera-v${{ steps.version.outputs.version }}-macOS.zip"

      - name: Verify package
        run: shasum -a 256 "build/Lentera-v${{ steps.version.outputs.version }}-macOS.zip"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "build/Lentera-v${{ steps.version.outputs.version }}-macOS.zip" --clobber
